name: Find Rocket.Chat version check

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Rocket.Chat Mobile 4.67.1
        uses: actions/checkout@v4
        with:
          repository: RocketChat/Rocket.Chat.ReactNative
          ref: 4.67.1
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Find supportedVersionsStatus logic
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Searching for supportedVersionsStatus..."
          echo "=========================================="

          FILES=$(grep -RIl \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            "supportedVersionsStatus" . || true)

          if [ -z "$FILES" ]; then
            echo "ERROR: supportedVersionsStatus was not found."
            exit 1
          fi

          echo ""
          echo "Found in:"
          echo "$FILES"

          while IFS= read -r file; do
            echo ""
            echo "=========================================="
            echo "FILE: $file"
            echo "=========================================="

            grep -n -C 30 \
              "supportedVersionsStatus" "$file" || true

          done <<< "$FILES"

      - name: Find expired status logic
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "Searching for 'expired' logic..."
          echo "=========================================="

          grep -Rni -C 15 \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            "expired" . || true

      - name: Find supported versions API logic
        shell: bash
        run: |
          echo ""
          echo "=========================================="
          echo "Searching for supportedVersions..."
          echo "=========================================="

          grep -Rni -C 15 \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            "supportedVersions" . || true

      - name: Stop after diagnostics
        run: |
          echo ""
          echo "=========================================="
          echo "DIAGNOSTIC COMPLETE"
          echo "=========================================="
          echo "No APK will be built in this run."
          echo "The output above shows where the compatibility"
          echo "decision is made."
          exit 1