name: Build Rocket.Chat 4.67.1 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Rocket.Chat Mobile 4.67.1
        uses: actions/checkout@v4
        with:
          repository: RocketChat/Rocket.Chat.ReactNative
          ref: 4.67.1
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Disable supported version blocking
        shell: bash
        run: |
          set -e

          FILE="app/lib/methods/checkSupportedVersions.ts"

          echo "=========================================="
          echo "Patching supported version check"
          echo "=========================================="

          python3 - <<'PY'
          from pathlib import Path

          file = Path("app/lib/methods/checkSupportedVersions.ts")
          text = file.read_text()

          start = text.find("const getStatus =")
          if start == -1:
              print("ERROR: getStatus function was not found.")
              raise SystemExit(1)

          end = text.find("\n};", start)
          if end == -1:
              print("ERROR: End of getStatus function was not found.")
              raise SystemExit(1)

          end += 3

          old = text[start:end]

          new = """const getStatus = ({ expiration, message }: { expiration?: string; message?: TSVMessage }): TSVStatus => {
           if (message) {
            return 'warn';
           }
           return 'supported';
          };"""

          text = text[:start] + new + text[end:]
          file.write_text(text)

          print("Patch applied successfully.")
          print()
          print(new)
          PY

          echo ""
          echo "=========================================="
          echo "Checking patched function"
          echo "=========================================="

          grep -n -A8 -B2 "const getStatus" "$FILE"

      - name: Create React Native bundle
        run: |
          set -e

          mkdir -p android/app/src/main/assets

          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build APK
        working-directory: android
        timeout-minutes: 45
        run: |
          set -e

          echo "=========================================="
          echo "Building Rocket.Chat Mobile 4.67.1"
          echo "=========================================="

          ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "Searching for APK files"
          echo "=========================================="

          echo ""
          echo "All APK files:"
          find android -type f -name "*.apk" -print || true

          echo ""
          echo "Build output:"
          find android/app/build -maxdepth 8 -type f 2>/dev/null | sort | head -200 || true

          echo ""
          echo "=========================================="
          echo "APK search finished"
          echo "=========================================="

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rocket-chat-4.67.1-apk
          path: android/**/*.apk
          if-no-files-found: error