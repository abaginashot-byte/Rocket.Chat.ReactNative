name: Build Rocket.Chat 4.67.1 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Rocket.Chat Mobile 4.67.1
        uses: actions/checkout@v4
        with:
          repository: RocketChat/Rocket.Chat.ReactNative
          ref: 4.67.1
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create React Native bundle
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build APK
        working-directory: android
        timeout-minutes: 45
        run: |
          echo "Building Rocket.Chat Mobile 4.67.1..."
          ./gradlew assembleDebug --no-daemon --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rocket-chat-4.67.1-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error