name: Find Rocket.Chat supported versions logic

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Rocket.Chat Mobile 4.67.1
        uses: actions/checkout@v4
        with:
          repository: RocketChat/Rocket.Chat.ReactNative
          ref: 4.67.1
          fetch-depth: 0

      - name: Find supported versions state
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "1. supportedVersions references"
          echo "=========================================="

          grep -Rni -C 15 \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            "supportedVersions" . || true

      - name: Find expired assignments
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "2. expired assignments"
          echo "=========================================="

          grep -Rni -C 20 \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            -E "['\"]expired['\"]|expired[[:space:]]*:" . || true

      - name: Find supported versions reducer
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "3. Redux reducer / slice"
          echo "=========================================="

          grep -Rni -C 20 \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            -E "createSlice|createReducer|supportedVersions" \
            app/reducers app/store app/state app 2>/dev/null || true

      - name: Find supported versions API calls
        shell: bash
        run: |
          set -e

          echo ""
          echo "=========================================="
          echo "4. API / REST / SDK calls"
          echo "=========================================="

          grep -Rni -C 15 \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            -E "supportedVersions|minimumClientVersions|versionStatus|versions" \
            app/lib app/sagas app/actions 2>/dev/null || true

      - name: Finish diagnostics
        run: |
          echo ""
          echo "=========================================="
          echo "DIAGNOSTICS FINISHED"
          echo "=========================================="
          echo "No APK was built."